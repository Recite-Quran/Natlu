name: Deploy Natlu to Cloudflare Pages

on:
  push:
    branches:
      - Natlu-الحمدلله
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Cloudflare Token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing or empty! Go to GitHub repo -> Settings -> Secrets and variables -> Actions -> and add 'CLOUDFLARE_API_TOKEN'."
            exit 1
          fi

      - name: Build Web App
        run: |
          chmod +x web/scripts/build.sh
          bash web/scripts/build.sh

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2aeefaef3564273a570980d9f70af9dc
        run: |
          npx --yes wrangler pages deploy build/web --project-name=natlu --branch=main --commit-dirty=true
