name: Build iOS XCFramework (zf_tajweed)

on:
  workflow_dispatch:
    inputs:
      commit_to_repo:
        description: 'Commit zf_tajweed.xcframework directly to branch?'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - quran

jobs:
  build-xcframework:
    name: Build zf_tajweed.xcframework
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify Xcode and CMake
        run: |
          xcodebuild -version
          cmake --version

      - name: Make build script executable
        run: chmod +x packages/recite_quran/native/tajweedformer/scripts/build_ios_xcframework.sh

      - name: Build XCFramework
        run: |
          ./packages/recite_quran/native/tajweedformer/scripts/build_ios_xcframework.sh xcframework_build

      - name: Archive XCFramework as ZIP
        run: |
          cd xcframework_build
          zip -r -y zf_tajweed.xcframework.zip zf_tajweed.xcframework
          ls -lh zf_tajweed.xcframework.zip

      - name: Upload XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zf_tajweed.xcframework
          path: xcframework_build/zf_tajweed.xcframework.zip
          retention-days: 30

      - name: Commit to Repository (Optional)
        if: ${{ inputs.commit_to_repo }}
        run: |
          mkdir -p packages/recite_quran/ios/Frameworks
          rm -rf packages/recite_quran/ios/Frameworks/zf_tajweed.xcframework
          cp -R xcframework_build/zf_tajweed.xcframework packages/recite_quran/ios/Frameworks/
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/recite_quran/ios/Frameworks/zf_tajweed.xcframework
          git commit -m "feat(ios): bundle zf_tajweed.xcframework" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}
