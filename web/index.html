  <script>
    // Self-contained Setup Engine (IIFE prevents any global identifier clashes)
    (function () {
      const PAGES_DB_NAME = 'MushafPagesDB';
      const PAGES_STORE_NAME = 'pages';

      // 1. Guard against third-party wakelock_plus web concurrency bug in no_sleep.js
      if (typeof navigator !== 'undefined' && navigator.wakeLock && navigator.wakeLock.request) {
        const _origWakeLock = navigator.wakeLock.request.bind(navigator.wakeLock);
        let _pendingLock = null;
        navigator.wakeLock.request = function (type) {
          if (_pendingLock) return _pendingLock;
          _pendingLock = _origWakeLock(type).catch(function () { return null; }).finally(function () { _pendingLock = null; });
          return _pendingLock;
        };
      }

      // 2. Flutter Web Bootstrapper
      if (!window.registerAppServiceWorker && 'serviceWorker' in navigator) {
        window.registerAppServiceWorker = function () {
          navigator.serviceWorker.register('sw.js')
            .then((reg) => { if (navigator.onLine) reg.update().catch(() => {}); })
            .catch((err) => console.warn('[PWA] ServiceWorker error:', err));
        };
      }

      window.bootFlutterApp = function () {
        if (window._flutterBootStarted) return;
        window._flutterBootStarted = true;
        if (typeof window.registerAppServiceWorker === 'function') {
          window.registerAppServiceWorker();
        }
        const s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        (document.head || document.documentElement).appendChild(s);
      };

      // 3. IndexedDB Helpers for Decoded Mushaf Vector Pages (Singleton Connection)
      let _pagesDbPromise = null;
      function openPagesDB() {
        if (_pagesDbPromise) return _pagesDbPromise;
        _pagesDbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(PAGES_DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(PAGES_STORE_NAME)) db.createObjectStore(PAGES_STORE_NAME);
          };
          req.onsuccess = (e) => {
            const db = e.target.result;
            db.onversionchange = () => { db.close(); _pagesDbPromise = null; };
            db.onclose = () => { _pagesDbPromise = null; };
            resolve(db);
          };
          req.onerror = (e) => {
            _pagesDbPromise = null;
            reject(e.target.error);
          };
        });
        return _pagesDbPromise;
      }

      window.hasCachedPages = async function () {
        try {
          const db = await openPagesDB();
          return new Promise((resolve) => {
            const tx = db.transaction(PAGES_STORE_NAME, 'readonly');
            const req = tx.objectStore(PAGES_STORE_NAME).count();
            req.onsuccess = () => resolve(req.result >= 605);
            req.onerror = () => resolve(false);
          });
        } catch (_) {
          return false;
        }
      };

      window.getPageFromDB = async function (key) {
        try {
          const db = await openPagesDB();
          return new Promise((resolve) => {
            const tx = db.transaction(PAGES_STORE_NAME, 'readonly');
            const req = tx.objectStore(PAGES_STORE_NAME).get(String(key));
            req.onsuccess = () => {
              if (!req.result) return resolve(null);
              if (req.result instanceof Uint8Array) return resolve(req.result);
              if (req.result instanceof ArrayBuffer) return resolve(new Uint8Array(req.result));
              return resolve(new Uint8Array(req.result.buffer || req.result));
            };
            req.onerror = () => resolve(null);
          });
        } catch (_) {
          return null;
        }
      };

      window.saveMushafPageToDB = async function (key, bytes) {
        try {
          const db = await openPagesDB();
          const tx = db.transaction(PAGES_STORE_NAME, 'readwrite');
          tx.objectStore(PAGES_STORE_NAME).put(bytes, String(key));
        } catch (_) { }
      };

      window.saveMushafPagesBatchToDB = async function (batch) {
        try {
          const db = await openPagesDB();
          return new Promise((resolve) => {
            const tx = db.transaction(PAGES_STORE_NAME, 'readwrite');
            const store = tx.objectStore(PAGES_STORE_NAME);
            for (const key of Object.keys(batch)) {
              store.put(batch[key], String(key));
            }
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch (_) {
          return false;
        }
      };

      // 5. High-Performance On-Demand Asset Fetcher (with multi-tier fallback for Firefox/AdBlock/ISP blocks)
      window.fetchPageAsset = async function (url) {
        const file = url.includes('/') ? url.split('/').pop() : url;
        const targets = [url, '/api/qvp?file=' + encodeURIComponent(file)];
        for (const target of targets) {
          try {
            const res = await fetch(target, { mode: 'cors' });
            const type = res.headers.get('content-type') || '';
            if (res.ok && !type.includes('text/html')) {
              return new Uint8Array(await res.arrayBuffer());
            }
          } catch (_) { }
        }
        console.warn('[QVP Web] Failed to fetch on-demand asset:', url);
        return null;
      };

      // Instant Boot: Start Flutter immediately on page load with zero splash or loading screen
      window.bootFlutterApp();
      window.hideAppSplash = function () { };

      window.clearAppCacheAndReload = async function () {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const reg of regs) await reg.unregister();
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            for (const k of keys) await caches.delete(k);
          }
        } catch (_) { }
        window.location.reload(true);
      };
    })();
  </script>
